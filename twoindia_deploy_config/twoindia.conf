server {
    listen 80;
    server_name twoindia.in www.twoindia.in;

    client_max_body_size 20M;

    # Serve Flask static files directly through Nginx
    location /static/ {
        alias /home/ec2-user/twoindia/app/static/;
        expires 30d;
        access_log off;
    }

    # Proxy dynamic requests to Gunicorn on port 8003
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
