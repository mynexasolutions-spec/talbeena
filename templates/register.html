{% extends 'user_base.html' %}

{% block title %}Sign Up – Talbeena{% endblock %}

{% block extra_css %}
<style>
  .register-container {
    max-width: 480px;
    margin: 80px auto;
    padding: 3rem 2rem;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border);
  }

  .register-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .register-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    color: var(--teal-dark);
    margin-bottom: 0.5rem;
  }

  .register-header p {
    color: var(--text-soft);
    font-size: 0.95rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-mid);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .form-control {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--warm-white);
    color: var(--text-dark);
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26, 107, 114, 0.15);
  }

  .btn-register {
    width: 100%;
    background: var(--teal);
    color: #fff;
    padding: 0.95rem;
    border-radius: 6px;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 1.5rem;
  }

  .btn-register:hover {
    background: var(--teal-dark);
  }

  .btn-register:active {
    transform: scale(0.98);
  }

  .register-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--text-soft);
  }

  .register-footer a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 700;
  }

  .register-footer a:hover {
    text-decoration: underline;
  }

  .divider {
    display: flex;
    align-items: center;
    margin: 2rem 0;
    gap: 1rem;
  }

  .divider-line {
    flex: 1;
    height: 2px;
    background: linear-gradient(to right, var(--border), var(--gold-pale));
  }

  .divider-text {
    color: var(--gold);
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    min-width: 40px;
    text-align: center;
  }

  .btn-google {
    width: 100%;
    background: #fff;
    color: var(--text-dark);
    padding: 0.95rem;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.95rem;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
  }

  .btn-google:hover {
    background: var(--warm-white);
    border-color: var(--text-mid);
  }

  .btn-google:active {
    transform: scale(0.98);
  }

  .google-icon {
    width: 18px;
    height: 18px;
  }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
  <div class="register-header">
    <h2>Create Account</h2>
    <p>Join Talbeena to track orders and save your details</p>
  </div>

  <form method="post" action="{{ url_for('auth.register') }}" data-turbo="false">
    <!-- CSRF Protection Token -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="first_name">First Name</label>
        <input class="form-control" type="text" id="first_name" name="first_name" required placeholder="John" />
      </div>
      <div class="form-group">
        <label class="form-label" for="last_name">Last Name</label>
        <input class="form-control" type="text" id="last_name" name="last_name" placeholder="Doe" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input class="form-control" type="email" id="email" name="email" required placeholder="john.doe@example.com" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required placeholder="Min 6 characters" minlength="6" />
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password" minlength="6" />
    </div>

    <button type="submit" class="btn-register">Sign Up</button>
  </form>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">OR</span>
    <div class="divider-line"></div>
  </div>

  <a href="{{ url_for('auth.auth_google') }}" class="btn-google">
    <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Sign up with Google
  </a>

  <div class="register-footer">
    Already have an account? <a href="/login">Log In</a>
  </div>
</div>
{% endblock %}
