{% extends 'user_base.html' %}

{% block title %}Sign Up – Talbeena{% endblock %}

{% block extra_css %}
<style>
  .register-container {
    max-width: 480px;
    margin: 80px auto;
    padding: 3rem 2rem;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border);
  }

  .register-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .register-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    color: var(--teal-dark);
    margin-bottom: 0.5rem;
  }

  .register-header p {
    color: var(--text-soft);
    font-size: 0.95rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-mid);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .form-control {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--warm-white);
    color: var(--text-dark);
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26, 107, 114, 0.15);
  }

  .btn-register {
    width: 100%;
    background: var(--teal);
    color: #fff;
    padding: 0.95rem;
    border-radius: 6px;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 1.5rem;
  }

  .btn-register:hover {
    background: var(--teal-dark);
  }

  .btn-register:active {
    transform: scale(0.98);
  }

  .register-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--text-soft);
  }

  .register-footer a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 700;
  }

  .register-footer a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
<div class="register-container">
  <div class="register-header">
    <h2>Create Account</h2>
    <p>Join Talbeena to track orders and save your details</p>
  </div>

  <form method="post" action="{{ url_for('auth.register') }}">
    <!-- CSRF Protection Token -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="first_name">First Name</label>
        <input class="form-control" type="text" id="first_name" name="first_name" required placeholder="John" />
      </div>
      <div class="form-group">
        <label class="form-label" for="last_name">Last Name</label>
        <input class="form-control" type="text" id="last_name" name="last_name" placeholder="Doe" />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input class="form-control" type="email" id="email" name="email" required placeholder="john.doe@example.com" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required placeholder="Min 6 characters" minlength="6" />
    </div>

    <div class="form-group">
      <label class="form-label" for="confirm_password">Confirm Password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password" minlength="6" />
    </div>

    <button type="submit" class="btn-register">Sign Up</button>
  </form>

  <div class="register-footer">
    Already have an account? <a href="/login">Log In</a>
  </div>
</div>
{% endblock %}
