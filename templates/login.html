{% extends 'user_base.html' %}

{% block title %}Login – Talbeena{% endblock %}

{% block extra_css %}
<style>
  .login-container {
    max-width: 450px;
    margin: 80px auto;
    padding: 3rem 2rem;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    border: 1px solid var(--border);
  }

  .login-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .login-header h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2rem;
    color: var(--teal-dark);
    margin-bottom: 0.5rem;
  }

  .login-header p {
    color: var(--text-soft);
    font-size: 0.95rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-mid);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .form-control {
    width: 100%;
    padding: 0.85rem 1rem;
    font-size: 1rem;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--warm-white);
    color: var(--text-dark);
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-control:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(26, 107, 114, 0.15);
  }

  .btn-login {
    width: 100%;
    background: var(--teal);
    color: #fff;
    padding: 0.95rem;
    border-radius: 6px;
    font-weight: 700;
    font-size: 1rem;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 1rem;
  }

  .btn-login:hover {
    background: var(--teal-dark);
  }

  .btn-login:active {
    transform: scale(0.98);
  }

  .login-footer {
    text-align: center;
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--text-soft);
  }

  .login-footer a {
    color: var(--gold);
    text-decoration: none;
    font-weight: 700;
  }

  .login-footer a:hover {
    text-decoration: underline;
  }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
  <div class="login-header">
    <h2>Welcome Back</h2>
    <p>Please log in to your Talbeena account</p>
  </div>

  <form method="post" action="{{ url_for('auth.login') }}">
    <!-- CSRF Protection Token -->
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

    <div class="form-group">
      <label class="form-label" for="email">Email Address</label>
      <input class="form-control" type="email" id="email" name="email" required placeholder="name@example.com" />
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required placeholder="••••••••" />
    </div>

    <button type="submit" class="btn-login">Log In</button>
  </form>

  <div class="login-footer">
    Don't have an account? <a href="/register">Sign Up</a>
  </div>
</div>
{% endblock %}
